name: Complete npm release

on:
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: 'Original publishing run ID containing the retained release bundle'
        required: true
        type: string
      confirmation:
        description: 'Type complete @coreai-ds/react-components@VERSION (never republishes)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  complete:
    if: >-
      github.repository == 'microsoft/coreai-design-system' &&
      github.ref == 'refs/heads/main' &&
      vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    concurrency:
      group: npm-production
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out current completion tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the original publishing run and select its retained bundle
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/workflows/scripts/release-target.mjs complete
      - name: Download the original release bundle without rebuilding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.source.outputs.artifact }}
          run-id: ${{ inputs.publish_run_id }}
          github-token: ${{ github.token }}
          path: package-artifacts
          merge-multiple: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install completion tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate retained checksum, confirmation, and source identity
        run: node .github/workflows/scripts/release-package.mjs inspect
      - name: Verify public version integrity and channel
        id: verify
        run: node .github/workflows/scripts/release-package.mjs verify
      - name: Create only missing Git tag and GitHub release
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/workflows/scripts/release-package.mjs record
      - name: Report completion stages
        if: always()
        env:
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          RECORD_RESULT: ${{ steps.record.outcome }}
        run: node .github/workflows/scripts/release-package.mjs summary
