name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Successful CI push run ID for the original version-changing main commit'
        required: true
        type: string
      confirmation:
        description: 'Type publish @coreai-ds/react-components@VERSION'
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    if: >-
      github.repository == 'microsoft/coreai-design-system' &&
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.head_repository.full_name == 'microsoft/coreai-design-system' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.conclusion == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Check out release orchestration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve the CI-approved release commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/workflows/scripts/release-target.mjs
      - name: Check out the CI-approved main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a version-changing commit
        id: version
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const path = 'packages/react-components/package.json';
          const before = JSON.parse(execFileSync('git', ['show', `HEAD^:${path}`], { encoding: 'utf8' }));
          const after = JSON.parse(readFileSync(path, 'utf8'));
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            assert.equal(process.env.CONFIRMATION, `publish ${after.name}@${after.version}`, 'Confirmation must match the original release version');
            assert.notEqual(before.version, after.version, 'Recovery requires a version-changing commit');
          }
          const changed = before.version !== after.version;
          console.log(changed ? `Release version changed: ${before.version} -> ${after.version}` : 'No version change; nothing to publish.');
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          NODE

  publish:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm-production
    concurrency:
      group: npm-production
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.detect.outputs.sha }}
    steps:
      - name: Check out the exact version-changing commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Install without dependency lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check public source and licenses
        run: |
          npm run check:public-source
          npm run license:check
      - name: Verify tree shaking
        run: npm run test:tree-shaking --workspace packages/react-components
      - name: Build and inspect the exact release tarball
        run: |
          npm run clean --workspace packages/react-components
          npm run build --workspace packages/react-components
          mkdir package-artifacts
          npm pack --workspace packages/react-components --ignore-scripts --pack-destination package-artifacts
          node packages/react-components/scripts/verify-package.mjs package-artifacts/*.tgz
      - name: Validate release and check npm
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/workflows/scripts/release-package.mjs prepare
      - name: Publish the verified tarball
        if: steps.release.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.release.outputs.tarball }}
          DIST_TAG: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo 'Configure the npm-production environment NPM_TOKEN secret.' >&2; exit 1; }
          npm publish "./$TARBALL" --ignore-scripts --access public --registry https://registry.npmjs.org/ --tag "$DIST_TAG"
      - name: Verify npm and create the Git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INTEGRITY: ${{ steps.release.outputs.integrity }}
        run: node .github/workflows/scripts/release-package.mjs record
