name: Deploy Azure apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'microsoft/coreai-design-system' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_AZURE_DEPLOY == 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: validate
    if: >-
      github.repository == 'microsoft/coreai-design-system' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      DOCSITE_APP_NAME: ${{ vars.DOCSITE_APP_NAME }}
      STORYBOOK_APP_NAME: ${{ vars.STORYBOOK_APP_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Check public source before building and packaging
        run: npm run check:public-source
      - name: Check required deployment configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP DOCSITE_APP_NAME STORYBOOK_APP_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deployment variable: $name"
              exit 1
            fi
          done
      - run: npm ci --prefer-offline
      - run: npm --workspace apps/storybook run stories:init
      - run: npm run build:storybook
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm --workspace apps/storybook run verify:build
      - run: npm run build:docsite
        env:
          STORYBOOK_INDEX_PATH: ${{ github.workspace }}/apps/storybook/storybook-static/index.json
      - name: Package production hosts
        run: bash .github/workflows/scripts/package-apps.sh
      - name: Sign in to Azure with OIDC
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify public docsite, Storybook and MCP access policy (read only)
        run: node .github/workflows/scripts/check-hosting-auth.mjs
      - name: Deploy docsite
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$DOCSITE_APP_NAME" \
            --src-path .deployment/deploy-docsite.zip --type zip --clean true --output none
      - name: Deploy Storybook and MCP
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$STORYBOOK_APP_NAME" \
            --src-path .deployment/deploy-storybook.zip --type zip --clean true \
            --track-status false --output none
      - name: Verify hosting access policy after deployment (read only)
        run: node .github/workflows/scripts/check-hosting-auth.mjs
