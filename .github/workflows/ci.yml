name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Test public-source safeguards
        run: node --test scripts/check-public-source.test.mjs scripts/license-headers.test.mjs
      - name: Check public source
        run: npm run check:public-source
      - name: Check license headers
        run: npm run license:check
      - run: npm ci --prefer-offline
      - name: Test release decisions and recovery
        run: node --test .github/workflows/scripts/release-package.test.mjs
      - run: npm run format:check
      - run: npm run lint -- --max-warnings=0
      - run: npm run type-check
      - name: Test guidance generation
        run: node --test shared/guidance.test.mjs
      - name: Test local Storybook source tooling
        run: npm --workspace apps/docsite run sources:ensure && node --test apps/storybook/scripts/story-inventory.test.mjs apps/storybook/scripts/story-source.test.mjs
      - name: Install Chromium
        run: npm --workspace packages/react-components run test:install-browser -- --with-deps
      - name: Test components
        run: npm --workspace packages/react-components test
